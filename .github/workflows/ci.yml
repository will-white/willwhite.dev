name: CI

on:
  pull_request:
    branches: ['main']
  # Pushes to main run this via deploy.yml, which gates the deploy on it.
  workflow_call:

permissions:
  contents: read

concurrency:
  # A new push to a PR supersedes its in-flight run. Calls from deploy.yml are
  # already serialised by its 'pages' group, so each gets a unique group here.
  group: ${{ github.event_name == 'pull_request' && format('ci-{0}', github.ref) || format('ci-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Formatting
        run: pnpm exec prettier --check .

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build
        env:
          # Authenticates the build-time GitHub API fetch on the home page
          # (unauthenticated requests are rate-limited on shared runners).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
